name: tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .[test]
      - run: PYTHONDONTWRITEBYTECODE=1 pytest -q
