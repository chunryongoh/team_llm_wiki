name: wiki-llm-synthesis

on:
  push:
    branches: [main]
    paths:
      - "raw/results/wiki-ingest/**"
  workflow_run:
    workflows: ["wiki-main-ingest"]
    types: [completed]
  workflow_dispatch:
    inputs:
      changed_paths:
        description: "Newline-separated raw packet paths or wiki-ingest report paths"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wiki-llm-synthesis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthesize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e .[test]
      - name: Collect changed paths
        env:
          INPUT_CHANGED_PATHS: ${{ inputs.changed_paths || '' }}
          PYTHONPATH: src
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r "$head" > changed-paths.txt
            else
              git diff --name-only "$base" "$head" > changed-paths.txt
            fi
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            git fetch origin main
            git checkout -B main origin/main
            INGEST_RUN_ID="${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}"
            printf "raw/results/wiki-ingest/$INGEST_RUN_ID/report.json\n" > changed-paths.txt
          else
            python - <<'PY'
          import os
          from pathlib import Path
          from team_llm_wiki.wiki_ingest.github_actions import workflow_dispatch_changed_paths

          paths = workflow_dispatch_changed_paths(os.environ, repo_root=Path("."))
          Path("changed-paths.txt").write_text("\n".join(paths) + ("\n" if paths else ""), encoding="utf-8")
          PY
          fi
      - name: Run GPT-5.5 wiki synthesis
        id: synth
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: src
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            printf "status=skipped\n" >> "$GITHUB_OUTPUT"
            printf "## LLM wiki synthesis\n\n건너뜀: OPENAI_API_KEY repository secret이 설정되어 있지 않습니다.\n" >> "$GITHUB_STEP_SUMMARY"
            touch add-paths.txt
            exit 0
          fi
          set +e
          output=$(python -m team_llm_wiki.cli run-llm-wiki-synthesis \
            --repo-root . \
            --changed-path-file changed-paths.txt \
            --run-id "$RUN_ID" \
            --model gpt-5.5 \
            --reasoning-effort high \
            --report-path "raw/results/llm-synthesis/$RUN_ID/report.json" 2>error.json)
          status=$?
          printf "%s\n" "$output" > llm-output.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from team_llm_wiki.wiki_ingest.github_actions import render_workflow_summary, safe_add_paths_file_from_payload, write_github_outputs

          raw = Path("llm-output.json").read_text(encoding="utf-8") if Path("llm-output.json").exists() else None
          payload = json.loads(raw) if raw else {}
          paths = safe_add_paths_file_from_payload(payload, Path("add-paths.txt"))
          write_github_outputs(Path(os.environ["GITHUB_OUTPUT"]), {
              "status": payload.get("status", "missing"),
              "add_paths": "\n".join(paths),
          })
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(render_workflow_summary(raw).replace("Wiki ingest", "LLM wiki synthesis"), encoding="utf-8")
          PY
          if [ "$status" -ne 0 ]; then
            cat llm-output.json
            cat error.json
            exit "$status"
          fi
      - name: Upload LLM synthesis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiki-llm-synthesis-report
          path: raw/results/llm-synthesis/*/report.json
          if-no-files-found: ignore
      - name: Validate LLM wiki output
        if: steps.synth.outputs.status == 'bot_pr'
        id: validate
        env:
          PYTHONPATH: src
        run: |
          health_command="python -m team_llm_wiki.cli check-wiki-health --repo-root ."
          test_command="python -m pytest tests/wiki_ingest/test_github_actions.py tests/wiki_ingest/test_llm_synthesis.py tests/wiki_ingest/test_workflows.py -q"
          set +e
          $health_command > wiki-health.json 2> wiki-health.err
          health_status=$?
          PYTHONDONTWRITEBYTECODE=1 $test_command > pytest-output.txt 2>&1
          test_status=$?
          HEALTH_STATUS="$health_status" TEST_STATUS="$test_status" HEALTH_COMMAND="$health_command" TEST_COMMAND="$test_command" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from team_llm_wiki.wiki_ingest.github_actions import validation_payload_from_outputs, write_github_outputs

          validation = validation_payload_from_outputs(
              health_stdout=Path("wiki-health.json").read_text(encoding="utf-8") if Path("wiki-health.json").exists() else "",
              health_stderr=Path("wiki-health.err").read_text(encoding="utf-8") if Path("wiki-health.err").exists() else "",
              health_status=int(os.environ["HEALTH_STATUS"]),
              health_command=os.environ["HEALTH_COMMAND"],
              pytest_stdout=Path("pytest-output.txt").read_text(encoding="utf-8") if Path("pytest-output.txt").exists() else "",
              pytest_status=int(os.environ["TEST_STATUS"]),
              pytest_command=os.environ["TEST_COMMAND"],
          )
          Path("validation-output.json").write_text(json.dumps(validation, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          write_github_outputs(Path(os.environ["GITHUB_OUTPUT"]), {"status": validation["status"]})
          PY
          cat validation-output.json
          if [ "$health_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            cat pytest-output.txt
            exit 1
          fi
      - name: Render LLM synthesis PR body
        if: steps.synth.outputs.status == 'bot_pr'
        id: pr_body
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from team_llm_wiki.wiki_ingest.github_actions import render_bot_pr_body, write_github_outputs

          payload = json.loads(Path("llm-output.json").read_text(encoding="utf-8"))
          validation_path = Path("validation-output.json")
          if validation_path.exists():
              payload["validation"] = json.loads(validation_path.read_text(encoding="utf-8"))
          body = "## 사용한 LLM 모델\n\n- `gpt-5.5`\n\n" + render_bot_pr_body(payload)
          write_github_outputs(Path(os.environ["GITHUB_OUTPUT"]), {"pr_body": body})
          PY
      - name: Create bot PR for LLM synthesis
        if: steps.synth.outputs.status == 'bot_pr'
        uses: peter-evans/create-pull-request@v8
        with:
          title: "[llm-wiki-bot][검토 필요] GPT-5.5 팀 위키 통합 정리"
          commit-message: "[llm-wiki-bot] GPT-5.5 팀 위키 통합 정리"
          body: ${{ steps.pr_body.outputs.pr_body }}
          branch: "bot/llm-synthesis-${{ github.run_id }}-${{ github.run_attempt }}"
          add-paths: ${{ steps.synth.outputs.add_paths }}
