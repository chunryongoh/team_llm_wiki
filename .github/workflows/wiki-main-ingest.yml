name: wiki-main-ingest

on:
  push:
    branches: [main]
    paths:
      - "raw/users/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "automation/schemas/**"
  workflow_dispatch:
    inputs:
      changed_paths:
        description: "Newline-separated changed paths"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wiki-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check wiki bot loop guard
        id: skip
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from team_llm_wiki.wiki_ingest.github_actions import should_skip_wiki_ingest, write_github_outputs

          skip = should_skip_wiki_ingest(
              os.environ.get("GITHUB_ACTOR_NAME", ""),
              commit_message=os.environ.get("COMMIT_MESSAGE") or None,
              pr_title=os.environ.get("PR_TITLE") or None,
          )
          write_github_outputs(Path(os.environ["GITHUB_OUTPUT"]), {"skip": "true" if skip else "false"})
          PY
      - name: Record skipped wiki bot ingest
        if: steps.skip.outputs.skip == 'true'
        run: |
          printf "## Wiki ingest\n\nSkipped wiki bot change with [wiki-bot] prefix to avoid an ingest loop.\n" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.skip.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Collect changed paths
        if: steps.skip.outputs.skip != 'true'
        id: changed
        env:
          INPUT_CHANGED_PATHS: ${{ inputs.changed_paths || '' }}
          PYTHONPATH: src
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r "$head" > changed-paths.txt
            else
              git diff --name-only "$base" "$head" > changed-paths.txt
            fi
          else
            python - <<'PY'
          import os
          from pathlib import Path
          from team_llm_wiki.wiki_ingest.github_actions import workflow_dispatch_changed_paths

          paths = workflow_dispatch_changed_paths(os.environ, repo_root=Path("."))
          Path("changed-paths.txt").write_text("\n".join(paths) + ("\n" if paths else ""), encoding="utf-8")
          PY
          fi
      - name: Run wiki ingest
        if: steps.skip.outputs.skip != 'true'
        id: ingest
        env:
          PYTHONPATH: src
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          output=$(python -m team_llm_wiki.cli run-wiki-main-ingest \
            --repo-root . \
            --changed-path-file changed-paths.txt \
            --run-id "$RUN_ID" \
            --report-path "raw/results/wiki-ingest/$RUN_ID/report.json" 2>error.json)
          status=$?
          printf "%s\n" "$output" > ingest-output.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from team_llm_wiki.wiki_ingest.github_actions import render_workflow_summary, safe_add_paths_file_from_payload, write_github_outputs

          raw = Path("ingest-output.json").read_text(encoding="utf-8") if Path("ingest-output.json").exists() else None
          payload = json.loads(raw) if raw else {}
          paths = safe_add_paths_file_from_payload(payload, Path("add-paths.txt"))
          write_github_outputs(Path(os.environ["GITHUB_OUTPUT"]), {
              "status": payload.get("status", "missing"),
              "add_paths": "\n".join(paths),
          })
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary_path.write_text(render_workflow_summary(raw), encoding="utf-8")
          Path("ingest-summary-written").write_text("1\n", encoding="utf-8")
          PY
          if [ "$status" -ne 0 ]; then
            cat ingest-output.json
            cat error.json
            exit "$status"
          fi
      - name: Fallback summary
        if: always() && steps.skip.outputs.skip != 'true'
        run: |
          if [ ! -f ingest-summary-written ]; then
            printf "## Wiki ingest\n\nMissing ingest output.\n" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload wiki ingest report
        if: always() && steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wiki-ingest-report
          path: raw/results/wiki-ingest/*/report.json
          if-no-files-found: error
      - name: Validate generated wiki output
        if: steps.skip.outputs.skip != 'true' && (steps.ingest.outputs.status == 'direct_commit' || steps.ingest.outputs.status == 'bot_pr')
        id: validate
        env:
          PYTHONPATH: src
        run: |
          health_command="python -m team_llm_wiki.cli check-wiki-health --repo-root ."
          test_command="python -m pytest tests/wiki_ingest/test_github_actions.py tests/wiki_ingest/test_runner.py tests/wiki_ingest/test_workflows.py -q"
          set +e
          $health_command > wiki-health.json 2> wiki-health.err
          health_status=$?
          PYTHONDONTWRITEBYTECODE=1 $test_command > pytest-output.txt 2>&1
          test_status=$?
          HEALTH_STATUS="$health_status" TEST_STATUS="$test_status" HEALTH_COMMAND="$health_command" TEST_COMMAND="$test_command" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from team_llm_wiki.wiki_ingest.github_actions import validation_payload_from_outputs, write_github_outputs

          validation = validation_payload_from_outputs(
              health_stdout=Path("wiki-health.json").read_text(encoding="utf-8") if Path("wiki-health.json").exists() else "",
              health_stderr=Path("wiki-health.err").read_text(encoding="utf-8") if Path("wiki-health.err").exists() else "",
              health_status=int(os.environ["HEALTH_STATUS"]),
              health_command=os.environ["HEALTH_COMMAND"],
              pytest_stdout=Path("pytest-output.txt").read_text(encoding="utf-8") if Path("pytest-output.txt").exists() else "",
              pytest_status=int(os.environ["TEST_STATUS"]),
              pytest_command=os.environ["TEST_COMMAND"],
          )
          Path("validation-output.json").write_text(json.dumps(validation, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          write_github_outputs(Path(os.environ["GITHUB_OUTPUT"]), {"status": validation["status"]})
          PY
          cat validation-output.json
          if [ "$health_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            cat pytest-output.txt
            exit 1
          fi
      - name: Render reviewed wiki PR body
        if: steps.skip.outputs.skip != 'true' && steps.ingest.outputs.status == 'bot_pr'
        id: pr_body
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from team_llm_wiki.wiki_ingest.github_actions import render_bot_pr_body, write_github_outputs

          payload = json.loads(Path("ingest-output.json").read_text(encoding="utf-8"))
          validation_path = Path("validation-output.json")
          if validation_path.exists():
              payload["validation"] = json.loads(validation_path.read_text(encoding="utf-8"))
          write_github_outputs(Path(os.environ["GITHUB_OUTPUT"]), {"pr_body": render_bot_pr_body(payload)})
          PY
      - name: Direct commit low-risk wiki updates
        if: steps.skip.outputs.skip != 'true' && steps.ingest.outputs.status == 'direct_commit'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -s add-paths.txt ]; then
            git add --pathspec-from-file=add-paths.txt
            git commit -m "[wiki-bot] ingest wiki packets" || exit 0
            git push
          fi
      - name: Create bot PR for reviewed wiki updates
        if: steps.skip.outputs.skip != 'true' && steps.ingest.outputs.status == 'bot_pr'
        uses: peter-evans/create-pull-request@v8
        with:
          title: "[wiki-bot][review-required] ingest wiki packets"
          commit-message: "[wiki-bot] ingest wiki packets"
          body: ${{ steps.pr_body.outputs.pr_body }}
          branch: "bot/wiki-ingest-${{ github.run_id }}-${{ github.run_attempt }}"
          add-paths: ${{ steps.ingest.outputs.add_paths }}
