name: wiki-health-check

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Check wiki health
        env:
          PYTHONPATH: src
        run: |
          python -m team_llm_wiki.cli check-wiki-health \
            --repo-root . \
            --report-path raw/results/wiki-health/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-health-report
          path: raw/results/wiki-health/report.json
