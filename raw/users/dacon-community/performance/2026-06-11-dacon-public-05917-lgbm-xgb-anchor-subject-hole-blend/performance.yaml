baseline_comparison:
  baseline_run_id: v152-anchor-reference
  caveat: V152 anchor is described as a previous strong base model but its OOF CSV and full feature parquet are not included.
  same_metric_definition: true
  same_split: false
claim_status: tentative
confusion_matrices: not applicable for log-loss-only code share reference
dataset:
  hash: not-provided
  name: sleep-lifelog-2024
  version: dacon-competition-package
feature_summary:
  calendar_features:
    - month
    - day
    - dayofweek
    - weekofyear
    - weekend
    - dayofyear
    - cyclic sin/cos
    - date_gap_days
    - subject_num
  sleep_windows:
    - daily_00_24
    - day_09_18
    - evening_18_21
    - prebed_21_24
    - sleep_21_09
    - late_00_03
    - deep_03_06
    - wake_06_09
  stability_filter: absolute correlation/proxy stability threshold min_stability 0.3 and max 300 features per target in shared notebook skeleton
  window_pair_status: partly placeholder; real sensor-derived pair features require parquet linkage
metric_definitions:
  notebook_local_oof_log_loss:
    caveat: Notebook states Local OOF 0.514 and local-public gap about 0.075; this is not team canonical OOF.
    direction: lower_is_better
    evidence_surface: notebook_output_summary
  public_lb_log_loss:
    caveat: No submission id, leaderboard export, or submission file lineage in packet.
    direction: lower_is_better
    evidence_surface: user_reported_public_lb_observation_in_dacon_codeshare
model:
  family: lgbm-xgb-anchor-blend
  weights_in_repo: false
model_structure:
  anchor_features: "base_{target}_prob and base_{target}_logit from V152 OOF when base_oof_path exists"
  blend: "reported LGBM+XGB about 7:3 with CatBoost weight 0 for final public 0.5917 summary"
  libraries:
    - LightGBM
    - XGBoost
    - CatBoost
  target_handling: one binary classifier family per target
  target_specific_blend_examples:
    - Q2 can prefer XGB-only in notebook discussion
    - S3/S4 can prefer CatBoost-only in notebook discussion
    - S1 can prefer LGBM 0.3 + CatBoost 0.7 in notebook discussion
oof_predictions: not included; V152 anchor OOF CSV and model OOF files are referenced but not provided
overall_metrics:
  cat_only_notebook_oof_log_loss: 0.528
  feature_count_after_stability_filter: 1682
  feature_count_before_stability_filter: 23177
  lgbm_only_notebook_oof_log_loss: 0.525
  log_loss: 0.5917
  notebook_local_oof_log_loss: 0.514
  notebook_local_public_gap: 0.075
  primary: public_lb_log_loss
  public_lb_log_loss: 0.5917
  target_specific_notebook_oof_log_loss: 0.513
  xgb_only_notebook_oof_log_loss: 0.53
preprocessing_summary:
  cv_strategy: "Subject-hole CV: each subject sorted by sleep_date, split into chronological chunks, early+late holes used as validation per fold"
  date_handling: sleep_date and lifelog_date parsed as datetime
  id_columns:
    - subject_id
    - sleep_date
    - lifelog_date
  leakage_guard: anchor OOF must be generated out-of-fold for train rows; full-train anchor prediction may be used only for test rows
primary_metric: public_lb_log_loss
required_metric_families:
  - log_loss
semantic_lint:
  - Do not promote the 0.5917 public score to a team verified leaderboard claim without submission id, leaderboard export, and submission file lineage.
  - Do not compare notebook Local OOF 0.514 directly with team canonical GroupKFold or Wave41 OOF results.
  - Treat V152 anchor as external reference until the actual OOF CSV and generation procedure are provided.
  - Window-pair features in the notebook are partly placeholder and should not be recorded as implemented production features without parquet-backed code.
