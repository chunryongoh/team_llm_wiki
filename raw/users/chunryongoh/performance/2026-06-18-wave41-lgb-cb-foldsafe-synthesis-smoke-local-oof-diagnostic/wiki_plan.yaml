semantic_lint:
- Do not promote local OOF diagnostic evidence to DACON public/private leaderboard
  or organizer-official validation.
- Do not call LGB/CB fold-safe synthesis broadly superior as a standalone model.
- Supported rows are supported by targetwise reblend weight, not target_delta_vs_anchor.
- Macro Brier disputed rows must remain visible in synthesis.
- This packet improves the local maintained diagnostic line but remains short of the
  0.61 goal.
- Do not call LGB/CB fold-safe synthesis a broadly superior standalone model; supported
  evidence is targetwise reblend/calibration diversity.
- Do not treat supported nested Platt rows as standalone target-score improvement
  because target_delta_vs_anchor is 0.0.
- Do not hide disputed macro Brier guard outcomes when describing reliability/sample-weight
  candidates.
- Graph-first missing public LB signals are expected for this packet and should not
  block the local OOF packet plan.
